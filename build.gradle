buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

def javaVer = 17

apply plugin: 'org.spongepowered.mixin'

apply from: 'gradle/config-view-processor.gradle'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            if (project.hasProperty('baniraDcevm')) {
                jvmArgs.add "-XX:+AllowEnhancedClassRedefinition"
                jvmArgs.add "-XX:HotswapAgent=fatjar"
            }
        }

        client {
            if (project.hasProperty('externalButtonsSmoke')) {
                property 'banira.externalButtonsSmoke', project.property('externalButtonsSmoke').toString()
            }
        }

        server {
            // args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // flatDir {
    //     dir 'libs'
    // }
}

configurations.create('baniraMinimapLibraries') { transitive = false }
dependencies {
    baniraMinimapLibraries "maven.modrinth:xaeros-minimap:dB6E0CY9"
    baniraMinimapLibraries "maven.modrinth:journeymap:HWDC99DO"
}
// Generated compile inputs must survive clean.
def minimapLibraryDirectory = file(".gradle/banira/minimap-compile-libraries/${loader_type}-${minecraft_version}")
minimapLibraryDirectory.mkdirs()
def prepareMinimapCompileLibraries = {
    configurations.baniraMinimapLibraries.files.each { artifact ->
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')
                        && (entry.name.contains('xaerolib-') || entry.name.contains('journeymap-api-'))) {
                    def output = new File(minimapLibraryDirectory, new File(entry.name).name)
                    zip.getInputStream(entry).withCloseable { stream ->
                        java.nio.file.Files.copy(stream, output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
    }
}
// Prepare before Forge's first dependency lookup, after deobf coordinates are registered.
configurations.configureEach { configuration ->
    if (configuration.name == '__obfuscated') {
        configuration.incoming.beforeResolve { prepareMinimapCompileLibraries() }
    }
}
repositories { flatDir { dirs minimapLibraryDirectory } }
dependencies {
    compileOnly fg.deobf("maven.modrinth:xaeros-minimap:dB6E0CY9")
    compileOnly fg.deobf("banira.optional:xaerolib-forge-1.20.1:1.7.3")
    compileOnly fg.deobf("maven.modrinth:journeymap:HWDC99DO")
    compileOnly fg.deobf("banira.optional:journeymap-api-forge-1.20.1:2.0.0")
    compileOnly fg.deobf("curse.maven:ftb-chunks-forge-314906:6431735")
    compileOnly fg.deobf("maven.modrinth:map-atlases-forge:Zcz2vXIl")
    if (project.hasProperty('minimapSmoke')) {
        switch (project.property('minimapSmoke').toString()) {
            case '':
            case 'xaero':
                runtimeOnly fg.deobf("maven.modrinth:xaeros-minimap:dB6E0CY9")
                runtimeOnly fg.deobf("banira.optional:xaerolib-forge-1.20.1:1.7.3")
                break
            case 'journey':
                runtimeOnly fg.deobf("maven.modrinth:journeymap:HWDC99DO")
                runtimeOnly fg.deobf("maven.modrinth:common-network:TkOARDQh")
                break
            case 'atlas':
                runtimeOnly fg.deobf("maven.modrinth:map-atlases-forge:Zcz2vXIl")
                runtimeOnly fg.deobf("maven.modrinth:moonlight:W0ZWjZib")
                break
            default: throw new GradleException('minimapSmoke: xaero, journey or atlas')
        }
    }
}

dependencies {
    runtimeOnly fg.deobf("maven.modrinth:spark:4FXHDE9F")
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'junit:junit:4.13.2'

    // The dedicated-server smoke child must not load client-only FPS HUD mods.
    if (!(project.findProperty('banira.networkSmoke.server') ?: 'false').toString().toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:embeddium-908741:${embeddium_id}")
        runtimeOnly fg.deobf("curse.maven:rubidium-extra-654373:${rubidium_extra_id}")
    }

    // Optional inventory integrations are available for development but are never production dependencies.
    compileOnly fg.deobf("curse.maven:jei-238222:${jei_id}")
    runtimeOnly fg.deobf("curse.maven:jei-238222:${jei_id}")
    compileOnly fg.deobf("curse.maven:architectury-api-419699:${architectury_id}")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:${architectury_id}")
    compileOnly fg.deobf("curse.maven:ftb-library-forge-404465:${ftb_library_id}")
    runtimeOnly fg.deobf("curse.maven:ftb-library-forge-404465:${ftb_library_id}")
}

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extra_settings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

prepareBaniraDevFpsOverlay()
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             loader_type         : loader_type,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))

    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// region 发布到 Maven 仓库（含本地 ~/.m2/repository）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = "${loader_type}-${minecraft_version}-${mod_version}"
        }
    }
    repositories {
        mavenLocal()
    }
}

afterEvaluate {
    publishing.publications.named('mavenJava', MavenPublication) {
        artifact tasks.shadowJar
        artifact tasks.named('sourcesJar')
    }
    tasks.named('publishMavenJavaPublicationToMavenLocalRepository').configure {
        dependsOn 'reobfShadowJar', 'sourcesJar'
    }
}
// endregion 发布到 Maven 仓库（含本地 ~/.m2/repository）

apply from: "gradle/publish-local-fingerprint.gradle"
apply from: "gradle/embedded-compiler.gradle"
apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"
