buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

def javaVer = 17

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            if (project.hasProperty('baniraDcevm')) {
                jvmArgs.add "-XX:+AllowEnhancedClassRedefinition"
                jvmArgs.add "-XX:HotswapAgent=fatjar"
            }
        }

        client {
            if (project.hasProperty('externalButtonsSmoke')) {
                property 'banira.externalButtonsSmoke', project.property('externalButtonsSmoke').toString()
            }
        }

        server {
            // args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    runtimeOnly fg.deobf("maven.modrinth:spark:GygIHGfW")
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'junit:junit:4.13.2'

    // The dedicated-server smoke child must not load client-only FPS HUD mods.
    if (!(project.findProperty('banira.networkSmoke.server') ?: 'false').toString().toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:embeddium-908741:${embeddium_id}")
        runtimeOnly fg.deobf("curse.maven:rubidium-extra-654373:${rubidium_extra_id}")
        runtimeOnly fg.deobf("curse.maven:textrues-embeddium-options-910506:${textrues_embeddium_options_id}")
    }

    // jei
    implementation fg.deobf("curse.maven:jei-238222:${jei_id}")

    // ftb
    implementation fg.deobf("curse.maven:architectury-api-419699:${architectury_id}")
    implementation fg.deobf("curse.maven:ftb-library-forge-404465:${ftb_library_id}")
}

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extra_settings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

prepareBaniraDevFpsOverlay()
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             loader_type         : loader_type,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))

    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// region 发布到 Maven 仓库（含本地 ~/.m2/repository）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = "${loader_type}-${minecraft_version}-${mod_version}"
        }
    }
    repositories {
        mavenLocal()
    }
}

afterEvaluate {
    publishing.publications.named('mavenJava', MavenPublication) {
        artifact tasks.jar
        artifact tasks.named('sourcesJar')
    }
    tasks.named('publishMavenJavaPublicationToMavenLocalRepository').configure {
        dependsOn 'reobfJar', 'sourcesJar'
    }
}
// endregion 发布到 Maven 仓库（含本地 ~/.m2/repository）

apply from: "gradle/publish-local-fingerprint.gradle"
apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"
