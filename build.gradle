plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

def javaVer = 25
if (JavaVersion.current() < JavaVersion.toVersion(javaVer)) {
    throw new GradleException('Minecraft 26.1 requires a Java 25 or newer Gradle JVM')
}

apply from: 'gradle/aui-validation-output.gradle'

apply from: 'gradle/config-view-processor.gradle'
apply from: 'gradle/aui-contract.gradle'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    withSourcesJar()
}

if (providers.gradleProperty('banira.neoForgeDependencyRepo').isPresent()) {
    minecraftArtifactCache.cacheDirectory.set(layout.projectDirectory.dir('.gradle/caches/minecraft'))
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    def offlineSupplement = providers.gradleProperty('banira.neoForgeOfflineSupplement').orNull
    if (offlineSupplement != null) {
        named('Mojang LWJGL Free Type Repository') {
            url = uri(offlineSupplement)
        }
    }
    def verifiedRepository = providers.gradleProperty('banira.neoForgeDependencyRepo').orNull
    if (verifiedRepository != null) {
        def verified = maven {
            url = uri(verifiedRepository)
            metadataSources {
                gradleMetadata()
                mavenPom()
            }
        }
        remove(verified)
        addFirst(verified)
    }
    mavenCentral()
    maven {
        url = 'https://libraries.minecraft.net'
        content { includeGroup 'com.mojang' }
    }
    maven {
        url = 'https://maven.fabricmc.net'
        content { includeModule 'net.fabricmc', 'sponge-mixin' }
    }
    maven {
        url = "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // flatDir {
    //     dir 'libs'
    // }
}

def xaeroCompileReference = 'maven.modrinth:xaeros-minimap:ktORDOcM'
def journeyMapContract = 'maven.modrinth:journeymap:5YEj4JLa'
def atlasCompileReference = 'maven.modrinth:map-atlases-forge:NdJwZprF'
def jeiContract = 'mezz.jei:jei-26.1-neoforge:29.2.0.21'
configurations.create('baniraMinimapLibraries') { transitive = false }
configurations.create('baniraJeiContract') {
    canBeConsumed = false
    transitive = false
}
configurations.compileOnly.extendsFrom(configurations.baniraJeiContract)
dependencies {
    baniraMinimapLibraries xaeroCompileReference
    baniraMinimapLibraries journeyMapContract
}
def minimapCompilerLibraries = providers.provider {
    // Generated compile inputs must survive clean.
    def directory = file(".gradle/banira/minimap-compile-libraries/${loader_type}-${minecraft_version}")
    directory.mkdirs()
    def libraries = []
    configurations.baniraMinimapLibraries.files.each { artifact ->
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')
                        && (entry.name.contains('xaerolib-') || entry.name.contains('journeymap-api-'))) {
                    def output = new File(directory, new File(entry.name).name)
                    zip.getInputStream(entry).withCloseable { stream ->
                        java.nio.file.Files.copy(stream, output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                    libraries.add(output)
                }
            }
        }
    }
    return libraries
}
dependencies {
    compileOnly files(minimapCompilerLibraries)
    // Xaero, FTB and Atlas currently publish NeoForge 26.1.2 references, not 26.1 runtime inputs.
    compileOnly(xaeroCompileReference) { transitive = false }
    compileOnly(journeyMapContract) { transitive = false }
    compileOnly('dev.ftb.mods:ftb-chunks-neoforge:26.1.2.10') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-chunks:26.1.2.10') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library-neoforge:26.1.2.11') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library:26.1.2.11') { transitive = false }
    compileOnly(atlasCompileReference) { transitive = false }
    if (project.hasProperty('minimapSmoke')) {
        switch (project.property('minimapSmoke').toString()) {
            case '':
                break
            case 'journey':
                localRuntime(journeyMapContract) { transitive = false }
                break
            case 'xaero':
            case 'atlas':
                throw new GradleException('Xaero and Atlas are compile-only references on NeoForge 26.1')
            default: throw new GradleException('minimapSmoke: journey')
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    baniraJeiContract jeiContract
    if ((project.findProperty('banira.devInventoryIntegrations') ?: 'true').toString().toBoolean()) {
        localRuntime(jeiContract) { transitive = false }
    }
}


tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version         : neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range,
                             loader_type         : loader_type,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

apply from: 'gradle/mixin-runtime.gradle'

tasks.named('jar', Jar).configure {
    // 自定义打包路径与输出格式
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))

    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }

}

tasks.named('sourcesJar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
}

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extra_settings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    doLast prepareBaniraDevFpsOverlay
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareDevFpsOverlay'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// region 发布到 Maven 仓库（含本地 ~/.m2/repository）
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = "${loader_type}-${minecraft_version}-${mod_version}"
        }
    }
    repositories {
        mavenLocal()
    }
}

afterEvaluate {
    publishing.publications.named('mavenJava', MavenPublication) {
        artifact tasks.shadowJar
        artifact tasks.named('sourcesJar')
    }
    tasks.named('publishMavenJavaPublicationToMavenLocalRepository').configure {
        dependsOn 'shadowJar', 'sourcesJar'
    }
}
// endregion 发布到 Maven 仓库（含本地 ~/.m2/repository）

apply from: "gradle/publish-local-fingerprint.gradle"
apply from: "gradle/embedded-compiler.gradle"
apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"
