plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
}

apply from: 'gradle/config-view-processor.gradle'
apply from: 'gradle/embedded-compiler.gradle'

def javaVer = 25

if (JavaVersion.current() < JavaVersion.toVersion(javaVer)) {
    throw new GradleException('Minecraft 26.1 requires a Java 25 or newer Gradle JVM')
}

group = 'xin.vanilla.banira'

version = project.mod_version
mod_id = project.mod_id
mod_name = project.mod_name
mod_desc = project.mod_desc

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
}

loom {
    runs {
        client {
            programArgs '--username', 'Dev', '--uuid', '380df991-f603-344c-a090-369bad2a924a'
        }
    }
}

repositories {
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Terraformers Maven"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases/'
        content { includeGroup 'dev.ftb.mods' }
    }
    // flatDir {
    //     dir 'libs'
    // }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

configurations.create('legacyFtbContract') {
    canBeConsumed = false
    transitive = false
}

dependencies {
    // Bytecode fixtures only; never load this legacy mod in the game or test JVM.
    legacyFtbContract 'curse.maven:ftb-library-fabric-438495:5631428'
    compileOnly "maven.modrinth:xaeros-minimap:DVSdniw4"
    compileOnly "maven.modrinth:journeymap:tHO89MsT"
    // FTB's available contracts target 26.1.2; they are not 26.1 runtime dependencies.
    compileOnly('dev.ftb.mods:ftb-chunks-fabric:26.1.2.10') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-chunks:26.1.2.10') { transitive = false }
    // Atlas requires Minecraft =26.1.2; retain only its integration compile reference.
    compileOnly('maven.modrinth:map-atlases:IvQaTGDa') { transitive = false }
    compileOnly "maven.modrinth:voxelmap-updated:NfOUNBHc"
    if (project.hasProperty('minimapSmoke')) {
        switch (project.property('minimapSmoke').toString()) {
            case '':
            case 'xaero': localRuntime "maven.modrinth:xaeros-minimap:DVSdniw4"; break
            case 'journey':
                localRuntime "maven.modrinth:journeymap:tHO89MsT"
                break
            case 'voxel': localRuntime "maven.modrinth:voxelmap-updated:NfOUNBHc"; break
            case 'atlas':
                throw new GradleException('minimapSmoke=atlas is unavailable for Minecraft 26.1: Map Atlases IvQaTGDa requires Minecraft =26.1.2 and Moonlight >=26.1.2-4.1.0; it is a compile-only reference')
            default: throw new GradleException('minimapSmoke: xaero, journey, voxel or atlas')
        }
    }
    // Optional runtime mods require a separately verified 26.1 receipt; no legacy defaults.
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation("net.fabricmc:fabric-loader:${project.loader_version}") {
        version { strictly(project.loader_version.toString()) }
    }
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        version { strictly(project.fabric_version.toString()) }
    }
    implementation fabricApi.module('fabric-networking-api-v1', project.fabric_version)
    implementation fabricApi.module('fabric-lifecycle-events-v1', project.fabric_version)

    testImplementation 'junit:junit:4.13.2'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.apache.maven:maven-artifact:4.0.0-rc-3"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    if (providers.gradleProperty('banira.devModMenu').getOrElse('false').toBoolean()) {
        localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    }

    // 可选背包按钮兼容只用于编译，Banira 本体不会强制安装这些模组。
    compileOnly('dev.ftb.mods:ftb-library-fabric:26.1.2.11') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library:26.1.2.11') { transitive = false }
    compileOnly "mezz.jei:jei-26.1-fabric:29.2.0.21"
    if ((project.findProperty('banira.devInventoryIntegrations') ?: 'true').toString().toBoolean()) {
        localRuntime "mezz.jei:jei-26.1-fabric:29.2.0.21"
    }

    runtimeOnly "org.joml:joml:1.10.4"
}

configurations.create('baniraMinimapLibraries') { transitive = false }
dependencies {
    baniraMinimapLibraries "maven.modrinth:xaeros-minimap:DVSdniw4"
    baniraMinimapLibraries "maven.modrinth:journeymap:tHO89MsT"
}
def minimapCompilerLibraries = providers.provider {
    // Generated compile inputs must survive clean.
    def directory = file(".gradle/banira/minimap-compile-libraries/${loader_type}-${minecraft_version}")
    directory.mkdirs()
    def libraries = []
    configurations.baniraMinimapLibraries.files.each { artifact ->
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                if ((entry.name.startsWith('META-INF/jars/xaerolib-')
                        || entry.name.startsWith('META-INF/jars/journeymap-api-')) && entry.name.endsWith('.jar')) {
                    def output = new File(directory, new File(entry.name).name)
                    zip.getInputStream(entry).withCloseable { stream ->
                        java.nio.file.Files.copy(stream, output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                    libraries.add(output)
                }
            }
        }
    }
    return libraries
}
dependencies {
    compileOnly files(minimapCompilerLibraries)
    testRuntimeOnly files(providers.provider {
        sourceSets.main.compileClasspath.files.findAll { (it.name.toLowerCase().contains('xaero') || it.name.toLowerCase().contains('journeymap')) }
    })
}

apply from: 'gradle/fabric-dev-runtime.gradle'

// Keeps the development client FPS counter enabled without affecting published artifacts.
def baniraDevFpsDefaultSettingsKey = 'extraSettings'
def prepareBaniraDevFpsOverlay = {
    def options = project.file('run/config/sodium-extra-options.json')
    def root = options.exists() ? new groovy.json.JsonSlurper().parse(options) : [:]
    if (!(root instanceof Map)) root = [:]
    def settingsKey = root.extra_settings instanceof Map ? 'extra_settings' : baniraDevFpsDefaultSettingsKey
    def enabledKey = settingsKey == 'extra_settings' ? 'show_fps' : 'showFps'
    def extra = root[settingsKey] instanceof Map ? root[settingsKey] : [:]
    extra[enabledKey] = true
    root[settingsKey] = extra
    options.parentFile.mkdirs()
    options.setText(groovy.json.JsonOutput.toJson(root), 'UTF-8')
}

tasks.register('prepareDevFpsOverlay') {
    onlyIf { providers.gradleProperty('banira.devFpsOverlay').getOrElse('false').toBoolean() }
    doFirst {
        if (!project.baniraDevOptionalRuntimeProjects.contains('sodium-extra')) {
            throw new GradleException('Development FPS overlay requires a verified 26.1 sodium-extra runtime pin')
        }
    }
    doLast prepareBaniraDevFpsOverlay
}

tasks.named('runClient').configure { dependsOn 'prepareDevFpsOverlay' }
processResources {
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_desc", project.mod_desc
    inputs.property "version", project.version
    inputs.property "mod_version", project.mod_version
    inputs.property "mod_authors", project.mod_authors
    inputs.property "sources_url", project.sources_url
    inputs.property "issues_url", project.issues_url
    inputs.property "license", project.license
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "loader_type", project.loader_type
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "mod_id": mod_id,
                "mod_name": project.mod_name,
                "mod_desc": project.mod_desc,
                "version": project.version,
                "mod_version": project.mod_version,
                "mod_authors": project.mod_authors,
                "sources_url": project.sources_url,
                "issues_url": project.issues_url,
                "license": project.license,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "loader_type": project.loader_type
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (javaVer >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(javaVer)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(javaVer)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(javaVer)
    }
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    archiveClassifier.set('dev')
    from("LICENSE") {
        rename { "${it}_${project.mod_id}" }
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set(mod_id)
    archiveVersion.set("${loader_type}-${minecraft_version}-${mod_version}")
    destinationDirectory.set(file("${projectDir}/builds/${mod_version}"))
}

// region 发布到 Maven 仓库（含本地 ~/.m2/repository）
def publicationContractRepository = layout.buildDirectory.dir('publication-contract-repository')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = "${loader_type}-${minecraft_version}-${mod_version}"
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'publicationContract'
            url = publicationContractRepository
        }
    }
}

afterEvaluate {
    publishing.publications.named('mavenJava', MavenPublication) {
        // The unobfuscated distribution includes the relocated embedded compiler.
        artifact tasks.named('shadowJar')
        artifact tasks.named('sourcesJar')
    }
    tasks.named('publishMavenJavaPublicationToMavenLocalRepository').configure {
        dependsOn 'shadowJar', 'sourcesJar'
    }
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn 'shadowJar', 'sourcesJar'
}

tasks.named('publishMavenJavaPublicationToPublicationContractRepository') {
    // 隔离仓库只验证本次发布，避免旧分类 JAR 污染契约结果。
    doFirst {
        project.delete(publicationContractRepository)
    }
}

tasks.named('test') {
    dependsOn 'publishMavenJavaPublicationToPublicationContractRepository'
    inputs.files(configurations.legacyFtbContract)
    doFirst {
        systemProperty 'banira.ftb.legacyContractJar', configurations.legacyFtbContract.singleFile.absolutePath
        systemProperty 'banira.ftb.contractJar', configurations.compileClasspath.files.find {
            it.name == 'ftb-library-26.1.2.11.jar'
        }.absolutePath
        systemProperty 'banira.jei.contractJar', configurations.compileClasspath.files.find {
            it.name == 'jei-26.1-fabric-29.2.0.21.jar'
        }.absolutePath
        systemProperty 'banira.publication.repository',
                publicationContractRepository.get().asFile.absolutePath
        systemProperty 'banira.publication.group', project.group.toString()
        systemProperty 'banira.publication.artifact', base.archivesName.get()
        systemProperty 'banira.publication.version',
                "${loader_type}-${minecraft_version}-${mod_version}"
        systemProperty 'banira.publication.jar',
                tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    }
}
// endregion 发布到 Maven 仓库（含本地 ~/.m2/repository）

apply from: "gradle/publish-local-fingerprint.gradle"
apply from: "gradle/network-smoke.gradle"
apply from: "gradle/spark-profile-report.gradle"
apply from: 'gradle/aui-contract.gradle'
apply from: 'gradle/aui-validation-output.gradle'
