buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-tree:9.7.1' }
}

import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.util.jar.JarFile
import java.security.MessageDigest
import org.objectweb.asm.ClassReader
import org.objectweb.asm.Opcodes
import org.objectweb.asm.tree.ClassNode

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ApricityUIOfficial'
                url = 'https://maven.sighs.cc/repository/maven-public/'
            }
        }
        forRepositories(fg.repository)
        filter { includeModule('com.sighs', 'ApricityUI-forge-1.20.1') }
    }
}

def sourceSha = '2C2A8B47B87E6397EEC823DBE978CA8AB1E96C1AD57EA61C1CC83E5FCABFA210'
def marker = 'META-INF/banira-aui-compile-api.properties'
def selected = providers.gradleProperty('banira.auiCompileApi').orNull
def ownedRoot = new File((providers.gradleProperty('banira.validationOutputRoot').orNull ?: layout.buildDirectory.get().asFile.absolutePath), 'aui-compile-api')
def ownedFile = { String name ->
    def candidate = new File(name)
    if (!candidate.isAbsolute() || candidate.absoluteFile.toPath().normalize().toFile() != candidate.canonicalFile
            || ownedRoot.absoluteFile.toPath().normalize().toFile() != ownedRoot.canonicalFile
            || !candidate.canonicalFile.toPath().startsWith(ownedRoot.canonicalFile.toPath()))
        throw new GradleException('AUI declarations require an owned absolute path')
    candidate.canonicalFile
}
configurations.create('auiCompileApi') {
    canBeResolved = true
    canBeConsumed = false
    transitive = false
}
if (selected != null) {
    def input = ownedFile(selected)
    if (!input.isFile()) throw new GradleException('AUI declaration jar is missing')
    dependencies.add('auiCompileApi', files(input))
    configurations.compileOnly.extendsFrom(configurations.auiCompileApi)
} else {
    dependencies.add('compileOnly', fg.deobf("com.sighs:ApricityUI-forge-1.20.1:${aui_version}")) { transitive = false }
}

tasks.register('verifyAuiCompileApi') {
    if (selected != null) {
        inputs.file(ownedFile(selected))
        inputs.file(file('gradle/aui-compile-contract.json'))
    }
    doLast {
        if (selected == null) return
        def input = ownedFile(selected)
        def contractFile = file('gradle/aui-compile-contract.json')
        if (!contractFile.isFile()) throw new GradleException('Pinned declaration contract is missing')
        def contract = new JsonSlurper().parse(contractFile, 'UTF-8')
        def contractBytes = contractFile.getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8')
        def contractSha = MessageDigest.getInstance('SHA-256').digest(contractBytes).encodeHex().toString()
        if (contract.sourceSha256 != sourceSha) throw new GradleException('Unpinned declaration source')
        new JarFile(input).withCloseable { jar ->
            def attributes = jar.manifest?.mainAttributes
            if (attributes?.getValue('Banira-AUI-Compile-Only') != 'true' || !jar.getEntry(marker)
                    || attributes.getValue('Banira-AUI-Source-SHA256') != sourceSha
                    || !attributes.getValue('Banira-AUI-Contract-SHA256')?.equalsIgnoreCase(contractSha))
                throw new GradleException('Unmarked or untraced AUI declarations')
            int major = attributes.getValue('Banira-AUI-Major') as int
            if (!(major in [52, 61])) throw new GradleException('Unsupported AUI declaration major')
            def classes = jar.entries().findAll { !it.directory && it.name.endsWith('.class') }
            if (classes.collect { it.name - '.class' }.toSet() != contract.classes.keySet().toSet()) throw new GradleException('Unexpected declaration symbols')
            classes.each { entry ->
                def node = new ClassNode()
                jar.getInputStream(entry).withCloseable { new ClassReader(it).accept(node, 0) }
                def expected = contract.classes[node.name]
                if (node.version != major || node.access != expected.access || node.superName != (expected.super == 'java/lang/Record' ? 'java/lang/Object' : expected.super)
                        || node.interfaces.toSet() != expected.interfaces.toSet()) throw new GradleException('Declaration major or hierarchy mismatch')
                if (node.methods.collect { it.name + it.desc }.toSet() != expected.methods.collect { it.name + it.desc }.toSet()
                        || node.fields.collect { it.name + ':' + it.desc }.toSet() != expected.fields.collect { it.name + ':' + it.desc }.toSet())
                    throw new GradleException('Declaration member mismatch')
                node.methods.each { method ->
                    def declaration = expected.methods.find { it.name == method.name && it.desc == method.desc }
                    def code = method.instructions.toArray()
                    if (method.access != (declaration.access & ~(Opcodes.ACC_NATIVE | Opcodes.ACC_ABSTRACT))
                            || code.collect { it.opcode } != [187, 89, 18, 183, 191]
                            || code[0].desc != 'java/lang/UnsupportedOperationException' || code[2].cst != 'Compile-only AUI declaration'
                            || code[3].owner != 'java/lang/UnsupportedOperationException' || code[3].name != '<init>' || code[3].desc != '(Ljava/lang/String;)V')
                        throw new GradleException('Executable declaration body or access mismatch')
                }
                node.fields.each { field ->
                    if (field.access != expected.fields.find { it.name == field.name && it.desc == field.desc }.access)
                        throw new GradleException('Declaration field access mismatch')
                }
            }
        }
        ['runtimeClasspath', 'annotationProcessor'].each { name ->
            if (configurations.findByName(name)?.files?.any { it.canonicalFile == input }) throw new GradleException("AUI declarations leaked into ${name}")
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'verifyAuiCompileApi' }
tasks.register('auiCompileApiModel') {
    dependsOn 'verifyAuiCompileApi'
    doLast {
        def paths = [:]
        ['compileClasspath', 'runtimeClasspath', 'annotationProcessor'].each { name ->
            paths[name] = configurations[name].files.collect { it.canonicalPath }.sort()
        }
        def target = ownedFile(providers.gradleProperty('banira.auiCompileApiModel').get())
        target.parentFile.mkdirs()
        target.setText(JsonOutput.prettyPrint(JsonOutput.toJson([selected: selected, configuration: configurations.auiCompileApi.files.collect { it.canonicalPath }, paths: paths])), 'UTF-8')
    }
}
