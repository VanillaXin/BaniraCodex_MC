import java.security.MessageDigest
import java.util.zip.ZipFile

repositories.exclusiveContent {
    forRepository { project.repositories.maven { url = 'https://maven.sighs.cc/repository/maven-public/' } }
    filter { includeModule('com.sighs', 'ApricityUI-fabric-1.18.2') }
}
configurations.create('auiContract') {
    canBeConsumed = false
    transitive = false
}
dependencies {
    def local = providers.gradleProperty('banira.auiContractJar').orNull
    if (local != null) {
        def artifact = new File(local)
        if (!artifact.isAbsolute() || !artifact.isFile()) throw new GradleException('AUI contract must be an existing absolute file')
        auiContract files(artifact)
    } else {
        throw new GradleException('Fabric 1.18.2 requires an explicit compile-only AUI contract; no runtime artifact is configured')
    }
    compileOnly files(configurations.auiContract)
    compileOnly 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.joml:joml:1.10.5'
}
def verify = tasks.register('verifyAuiContract') {
    doLast {
        def hash = MessageDigest.getInstance('SHA-256').digest(configurations.auiContract.singleFile.bytes).encodeHex().toString()
        if (!hash.equalsIgnoreCase('D557E54540C71D87920056D1F36A05480E4FEF0E0063A1D61D18DC8E2BC81D8B'))
            throw new GradleException('AUI 1.18.2 compile-only contract SHA-256 mismatch')
    }
}
tasks.named('compileJava') { dependsOn verify }
tasks.withType(Test).configureEach {
    dependsOn verify
    doFirst {
        def contracts = sourceSets.main.compileClasspath.files.findAll { artifact ->
            if (!artifact.name.endsWith('.jar')) return false
            new ZipFile(artifact).withCloseable { zip -> zip.getEntry('com/sighs/apricityui/screen/ApricityScreen.class') != null }
        }
        if (contracts.size() != 1) throw new GradleException('Expected one compile-only AUI contract')
        systemProperty 'banira.aui.contractJar', contracts[0].absolutePath
    }
}
