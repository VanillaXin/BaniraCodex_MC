import java.security.MessageDigest

repositories.exclusiveContent {
    forRepository {
        project.repositories.maven { url = 'https://maven.sighs.cc/repository/maven-public/' }
    }
    filter { includeModule('com.sighs', 'ApricityUI-forge-1.19.2') }
}

configurations.create('auiContract') {
    canBeConsumed = false
    transitive = false
}
jarJar.enable()
dependencies {
    minecraftLibrary 'org.joml:joml:1.10.5'
    jarJar('org.joml:joml:1.10.5') {
        transitive = false
        jarJar.ranged(it, '[1.10.5,1.11)')
        jarJar.pin(it, '1.10.5')
    }
    testCompileOnly 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.joml:joml:1.10.5'
    def localContract = providers.gradleProperty('banira.auiContractJar').orNull
    if (localContract != null) {
        def artifact = new File(localContract)
        if (!artifact.isAbsolute() || !artifact.isFile()) {
            throw new GradleException('banira.auiContractJar must be an existing absolute file')
        }
        auiContract files(artifact)
    } else {
        auiContract('com.sighs:ApricityUI-forge-1.19.2:1.3.0') {
            version { strictly('1.3.0') }
        }
    }
}

configurations.compileOnly.extendsFrom(configurations.auiContract)

// Shadow expands nested jars, so attach Forge's unchanged library entries after shading.
tasks.named('shadowJar').configure {
    dependsOn tasks.named('jarJar')
    inputs.file(tasks.named('jarJar').flatMap { it.archiveFile })
    doLast {
        ant.zip(destfile: archiveFile.get().asFile, update: true, encoding: 'UTF-8') {
            zipfileset(src: tasks.named('jarJar').get().archiveFile.get().asFile) {
                include(name: 'META-INF/jarjar/**')
            }
        }
    }
}

def verifyAuiContract = tasks.register('verifyAuiContract') {
    doLast {
        def artifact = configurations.auiContract.singleFile
        def actual = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        if (!actual.equalsIgnoreCase('9F7A199D835EEC069E9C26D42AA8D65D2873ED219CA168750A69BD5408B42C53')) {
            throw new GradleException('AUI Forge 1.19.2 contract SHA-256 mismatch')
        }
    }
}

tasks.named('compileJava') { dependsOn verifyAuiContract }

tasks.withType(Test).configureEach {
    dependsOn verifyAuiContract
    doFirst {
        systemProperty 'banira.aui.contractJar', configurations.auiContract.singleFile.absolutePath
        systemProperty 'banira.minimap.contractJars', configurations.compileClasspath.files.findAll {
            it.name.startsWith('journeymap-') || it.name.startsWith('xaeros-minimap-') || it.name.startsWith('ftb-chunks-forge-')
        }.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
