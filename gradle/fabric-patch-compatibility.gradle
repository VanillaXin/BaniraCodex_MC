def patchSuite = 'xin.vanilla.banira.internal.compat.Fabric26PatchCompatibilityTest'

tasks.named('test') {
    filter { excludeTestsMatching patchSuite }
}

tasks.register('patchCompatibilityTest', Test) {
    dependsOn 'shadowJar', 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching patchSuite }
    def manifest = providers.gradleProperty('banira.patchCompatibilityManifest')
    inputs.property('patchManifestPath', manifest.orElse(''))
    inputs.files(providers.provider {
        if (!manifest.isPresent()) return []
        def source = file(manifest.get())
        if (!source.isFile()) return [source]
        def clients = new groovy.json.JsonSlurper().parse(source)
        [source] + clients.values().collect { file(it.toString()) }
    })
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doFirst {
        if (!manifest.isPresent() || !new File(manifest.get()).isAbsolute()
                || !new File(manifest.get()).isFile()) {
            throw new GradleException('patchCompatibilityTest requires an absolute banira.patchCompatibilityManifest file')
        }
        systemProperty 'banira.patchCompatibilityManifest', manifest.get()
        systemProperty 'banira.publication.jar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    }
}
