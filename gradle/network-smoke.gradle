import java.time.LocalDateTime
import java.time.format.DateTimeFormatter
import java.util.concurrent.TimeUnit

def smokeRoot = file("${projectDir}/run-network-smoke")
def smokeServerDir = file("${smokeRoot}/server")
def smokeClientDir = file("${smokeRoot}/client")
def smokePort = 25579
def smokeChild = (project.findProperty('banira.networkSmoke.child') ?: 'false').toString().toBoolean()

if (smokeChild) {
    layout.buildDirectory.set(file(project.property('banira.networkSmoke.buildDir')))
    String phase = project.property('banira.networkSmoke.phase').toString()
    String status = project.property('banira.networkSmoke.status').toString()
    String report = project.property('banira.networkSmoke.sparkReport').toString()
    String clientReport = project.findProperty('banira.networkSmoke.clientSparkReport')?.toString() ?: ''
    loom.runs {
        configureEach {
            property 'banira.networkSmoke', 'true'
            property 'banira.networkSmoke.phase', phase
            property 'banira.networkSmoke.status', status
            property 'banira.networkSmoke.sparkReport', report
            property 'banira.networkSmoke.clientSparkReport', clientReport
        }
        server {
            runDir project.relativePath(smokeServerDir)
            programArgs '--nogui', '--port', smokePort.toString()
        }
        client {
            runDir project.relativePath(smokeClientDir)
            property 'banira.networkSmoke.host', '127.0.0.1'
            property 'banira.networkSmoke.port', smokePort.toString()
            programArgs '--username', 'BaniraSmoke', '--uuid', '7430d12c-4bf7-3e49-ae31-b9d26b715af2'
        }
    }
}

def readUtf8 = { File file -> file.isFile() ? file.getText('UTF-8') : '' }
def tailUtf8 = { File file -> file.isFile() ? file.readLines('UTF-8').takeRight(120).join(System.lineSeparator()) : '' }
def sparkRuntime = {
    def candidates = []
    ['modRuntimeOnly', 'runtimeClasspath'].each { name ->
        def configuration = configurations.findByName(name)
        if (configuration != null) candidates.addAll(configuration.files)
    }
    candidates.find { candidate ->
        if (!candidate.isFile() || !candidate.name.toLowerCase().startsWith('spark-')) {
            false
        } else {
            def archive = new java.util.zip.ZipFile(candidate)
            try {
                archive.getEntry('me/lucko/spark/proto/SparkSamplerProtos$SamplerData.class') != null
                        || archive.getEntry('me/lucko/spark/proto/SparkProtos$SamplerData.class') != null
            } finally {
                archive.close()
            }
        }
    }
}
def destroy = { Process process ->
    if (process?.isAlive()) {
        process.toHandle().descendants().forEach { it.destroyForcibly() }
        process.destroyForcibly()
        process.waitFor(15, TimeUnit.SECONDS)
    }
}
def waitFor = { Process process, File status, String marker, File log, int timeout ->
    long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(timeout)
    while (System.nanoTime() < deadline) {
        String content = readUtf8(status)
        if (content.contains('FAIL ')) throw new GradleException("Network smoke failed for '${marker}':\n${content}\n${tailUtf8(log)}")
        if (content.contains(marker)) return
        if (!process.isAlive()) throw new GradleException("Process exited before '${marker}' (${process.exitValue()}):\n${tailUtf8(log)}")
        Thread.sleep(500L)
    }
    throw new GradleException("Timed out waiting for '${marker}':\n${tailUtf8(log)}")
}
def start = { String task, String phase, File status, File report, File clientReport, File log ->
    File childRoot = new File(smokeRoot, task == 'runServer' ? 'server-gradle' : 'client-gradle')
    File wrapper = file("${projectDir}/${System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'}")
    List<String> command = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd.exe', '/d', '/c', wrapper.absolutePath] : [wrapper.absolutePath]
    command.addAll([task, '--no-daemon', '--console=plain', '--project-cache-dir', new File(childRoot, 'project-cache').absolutePath,
                    '-Pbanira.networkSmoke.child=true', "-Pbanira.networkSmoke.phase=${phase}", "-Pbanira.networkSmoke.status=${status.absolutePath}",
                    "-Pbanira.networkSmoke.sparkReport=${report.absolutePath}", "-Pbanira.networkSmoke.clientSparkReport=${clientReport.absolutePath}",
                    "-Pbanira.networkSmoke.buildDir=${new File(childRoot, 'build').absolutePath}"])
    log.parentFile.mkdirs()
    ProcessBuilder builder = new ProcessBuilder(command.collect { it.toString() })
    builder.directory(projectDir)
    builder.redirectErrorStream(true)
    builder.redirectOutput(log)
    builder.start()
}

tasks.register('networkSmoke') {
    group = 'verification'
    description = 'Runs Banira managed-config, player-data, file, event, remote-client, and Spark smoke.'
    doLast {
        if (smokeChild) throw new GradleException('networkSmoke cannot run as a child')
        delete smokeRoot
        smokeServerDir.mkdirs()
        smokeClientDir.mkdirs()
        new File(smokeServerDir, 'eula.txt').setText('eula=true' + System.lineSeparator(), 'UTF-8')
        new File(smokeServerDir, 'server.properties').setText(
                "online-mode=false${System.lineSeparator()}server-port=${smokePort}${System.lineSeparator()}"
                        + "level-name=network-smoke-world${System.lineSeparator()}view-distance=4${System.lineSeparator()}", 'UTF-8')
        File evidence = file("${smokeRoot}/evidence/${DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss').format(LocalDateTime.now())}")
        evidence.mkdirs()
        def profilerJar = sparkRuntime()
        if (profilerJar == null) throw new GradleException('Unable to resolve the Spark runtime jar for network smoke evidence.')
        new File(evidence, 'spark-runtime-phase-one.txt').setText(profilerJar.absolutePath + System.lineSeparator(), 'UTF-8')
        ['phase-one', 'phase-two'].each { phase ->
            File serverStatus = new File(evidence, "server-${phase}.status")
            File clientStatus = new File(evidence, "client-${phase}.status")
            File report = new File(evidence, "spark-report-${phase}.sparkprofile")
            File clientReport = new File(evidence, "spark-client-report-${phase}.sparkprofile")
            File serverLog = new File(evidence, "server-${phase}.log")
            File clientLog = new File(evidence, "client-${phase}.log")
            Process server = null
            Process client = null
            try {
                server = start('runServer', phase, serverStatus, report, clientReport, serverLog)
                waitFor(server, serverStatus, 'PASS server-ready', serverLog, 180)
                client = start('runClient', phase, clientStatus, report, clientReport, clientLog)
                if (phase == 'phase-one') {
                    waitFor(server, serverStatus, 'PASS spark-report-written', serverLog, 120)
                    if (!report.isFile() || report.length() == 0L) throw new GradleException("Spark report was not written: ${report}")
                    waitFor(client, clientStatus, 'PASS client-ui-spark-report-written', clientLog, 120)
                    if (!clientReport.isFile() || clientReport.length() == 0L) throw new GradleException("Client Spark report was not written: ${clientReport}")
                }
                waitFor(client, clientStatus, "FINISHED ${phase}", clientLog, 180)
                if (!client.waitFor(45, TimeUnit.SECONDS) || client.exitValue() != 0) throw new GradleException("Client failed:\n${tailUtf8(clientLog)}")
                waitFor(server, serverStatus, "FINISHED ${phase}", serverLog, 30)
                if (!server.waitFor(60, TimeUnit.SECONDS) || server.exitValue() != 0) throw new GradleException("Server failed:\n${tailUtf8(serverLog)}")
                def expected = phase == 'phase-one'
                        ? ['PASS event-bridge', 'PASS config-hot-reload', 'PASS player-data-file', 'PASS file-operation', 'PASS spark-profiler-active', 'PASS spark-report-written', 'FINISHED phase-one', 'PASS server-shutdown']
                        : ['PASS persisted-player-data', 'FINISHED phase-two', 'PASS server-shutdown']
                expected.each { marker ->
                    if (!readUtf8(serverStatus).contains(marker)) throw new GradleException("Missing '${marker}':\n${readUtf8(serverStatus)}")
                }
            } finally {
                destroy(client)
                destroy(server)
            }
        }
        def crashes = fileTree(smokeRoot) { include '**/crash-reports/crash-*.txt' }.files
        if (!crashes.isEmpty()) throw new GradleException("Network smoke created crash reports: ${crashes*.absolutePath}")
        logger.lifecycle("Banira network smoke FINISHED: ${evidence}")
    }
}
