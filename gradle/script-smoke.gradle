import java.util.concurrent.TimeUnit

def smokeDirectory = layout.buildDirectory.dir('script-smoke').get().asFile
def statusFile = new File(smokeDirectory, 'client.status')
def smokeMode = (project.findProperty('banira.scriptSmoke.mode') ?: 'script').toString()
if (!(smokeMode in ['script', 'config'])) throw new GradleException('Unknown script smoke mode: ' + smokeMode)
if (project.hasProperty('banira.scriptSmoke')) {
    // This probe covers compilation, not optional inventory or rendering integrations.
    configurations.runtimeClasspath.exclude(group: 'curse.maven')
    minecraft.runs.client {
        workingDirectory new File(smokeDirectory, 'client')
        property 'banira.scriptSmoke', 'true'
        property 'banira.scriptSmoke.status', statusFile.absolutePath
        property 'banira.scriptSmoke.mode', smokeMode
        jvmArgs.removeAll { it.contains('HotswapAgent') || it.contains('AllowEnhancedClassRedefinition') }
    }
}

tasks.register('scriptSmoke') {
    group = 'verification'
    description = 'Runs the bounded compiler or config transaction client probe'
    doLast {
        smokeDirectory.mkdirs()
        statusFile.delete()
        def command = [new File(System.getProperty('java.home'), 'bin/java.exe').absolutePath,
                       '-classpath', file('gradle/wrapper/gradle-wrapper.jar').absolutePath,
                       'org.gradle.wrapper.GradleWrapperMain', 'runClient', '--offline', '--console=plain',
                       '-Pbanira.scriptSmoke=true', '-Pbanira.scriptSmoke.mode=' + smokeMode]
        def process = new ProcessBuilder(command).directory(projectDir).redirectErrorStream(true)
                .redirectOutput(new File(smokeDirectory, 'client.log')).start()
        try {
            if (!process.waitFor(180, TimeUnit.SECONDS)) throw new GradleException('Script client smoke timed out')
            def status = statusFile.isFile() ? statusFile.getText('UTF-8') : ''
            if (process.exitValue() != 0 || !status.contains('FINISHED ' + smokeMode + '-client') || status.contains('FAIL')) {
                throw new GradleException('Script client smoke failed; see ' + new File(smokeDirectory, 'client.log'))
            }
            logger.lifecycle(status.trim())
        } finally {
            if (process.isAlive()) {
                process.toHandle().descendants().forEach { it.destroyForcibly() }
                process.destroyForcibly()
                process.waitFor(10, TimeUnit.SECONDS)
            }
        }
    }
}
