<html>
<head>
    <meta name="aui-viewport" content="mode=gui" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="native-dialog.css" />
    <link rel="stylesheet" href="quick-screen-picker.css" />
</head>
<body class="native-dialog-root">
<div class="page native-dialog screen-picker">
    <div id="title" class="native-title"></div>
    <div class="search">
        <input id="search" />
        <button id="clear_search"></button>
        <button id="filter_unavailable"></button>
    </div>
    <div id="content" class="content">
        <div id="empty" class="picker-empty"></div>
        <div id="fields"></div>
    </div>
    <div class="footer native-footer">
        <button id="confirm" disabled></button>
        <div id="status"></div>
        <button id="footer_close"></button>
    </div>
</div>
<div id="banira_picker_script" style="display:none"></div>
<script src="quick-screen-picker.js"></script>
</body>
</html>
